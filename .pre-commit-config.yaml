repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5000]
  - repo: https://github.com/nbQA-dev/nbstripout
    rev: 2.1.0
    hooks:
      - id: nbstripout
        args: [--extra-keys=metadata.language_info.metadata.vscode.languageId]
