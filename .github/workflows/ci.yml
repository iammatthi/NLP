name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Sync dependencies (dev)
        run: uv sync --dev
      - name: Lint (ruff)
        run: uv run --dev ruff check .
      - name: Format check (ruff)
        run: uv run --dev ruff format --check .
      - name: Test (pytest)
        run: uv run --dev pytest -q
      - name: Verify tracked data
        run: uv run python scripts/verify_data.py
